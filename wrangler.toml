# MiningLedger: Cloudflare Worker config (deployed by Cloudflare from GitHub).
name = "miningledger"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Custom domain (Cloudflare creates the DNS record and certificate on deploy).
routes = [{ pattern = "miningledger.crankyape.space", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/auth/*"]

# Database. Create it in Cloudflare (Storage & Databases > D1 > Create, name: miningledger)
# and paste its Database ID here. Tables are created automatically.
[[d1_databases]]
binding = "DB"
database_name = "miningledger"
database_id = "9de6ad2c-5179-4574-a612-b314384818a1"

# Every 10 minutes: read mining ledgers. At 5 past each hour: refresh Jita ice prices.
[triggers]
crons = ["*/10 * * * *", "5 * * * *"]

[vars]
# Client ID of the EVE application (developers.eveonline.com). Public value, safe to commit.
# Callback URL there: https://miningledger.crankyape.space/auth/callback
# Scope there: esi-industry.read_character_mining.v1
EVE_CLIENT_ID = "dab563b12e38463d931d76d509e84747"

# Secret (not in this file): TOKEN_KEY, a long random string used to encrypt EVE refresh tokens.
# Settings > Variables and Secrets > Add > Secret.

[observability]
enabled = true
